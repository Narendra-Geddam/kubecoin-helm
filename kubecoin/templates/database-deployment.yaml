apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.database.deploymentName }}
  labels:
    module: db-postgres
spec:
  replicas: {{ .Values.database.replicas }}
  selector:
    matchLabels:
      module: db-postgres
  template:
    metadata:
      labels:
        module: db-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.database.containerPort }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.auth.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.database.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.auth.database | quote }}
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-sql
          configMap:
            name: {{ .Values.database.initConfigMapName }}