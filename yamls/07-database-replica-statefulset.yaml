apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: kubecoin
  labels:
    module: db-postgres
    role: replica
spec:
  serviceName: postgres-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      module: db-postgres
      role: replica
  template:
    metadata:
      labels:
        module: db-postgres
        role: replica
    spec:
      containers:
        - name: postgres
          image: postgres:18.1-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "kubecoin"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGPASSWORD
              value: "replicator_password"
          command:
            - /bin/bash
            - -ec
            - |
              mkdir -p "$PGDATA"
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                rm -rf "${PGDATA:?}"/*
                until pg_isready -h database-primary-svc -p 5432 -U replicator; do
                  echo "Waiting for primary PostgreSQL..."
                  sleep 2
                done
                until pg_basebackup -h database-primary-svc -p 5432 -U replicator -D "$PGDATA" -Fp -Xs -P -R; do
                  echo "Primary not ready for base backup, retrying..."
                  sleep 2
                done
              fi
              exec docker-entrypoint.sh postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "local-path"
        resources:
          requests:
            storage: "8Gi"